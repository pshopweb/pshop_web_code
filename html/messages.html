<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PShop - Messages</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .messages-page {
            padding: 40px 0;
        }

        .messages-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            min-height: 500px;
        }

        .messages-sidebar {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .messages-sidebar h3 {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }

        .message-thread {
            padding: 16px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .message-thread:hover,
        .message-thread.active {
            background: #f0f7ff;
        }

        .message-thread h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .message-thread p {
            font-size: 0.85rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-thread .time {
            font-size: 0.75rem;
            color: #aaa;
            float: right;
        }

        .chat-area {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 400px;
        }

        .chat-message {
            margin-bottom: 16px;
            display: flex;
        }

        .chat-message.sent {
            justify-content: flex-end;
        }

        .chat-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-message.received .chat-bubble {
            background: #f0f0f0;
            border-bottom-left-radius: 4px;
        }

        .chat-message.sent .chat-bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-input {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
        }

        .chat-input button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        .new-message-form {
            padding: 20px;
        }

        .new-message-form .form-group {
            margin-bottom: 12px;
        }

        .new-message-form input,
        .new-message-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .new-message-form textarea {
            height: 120px;
            resize: vertical;
        }

        @media (max-width: 768px) {
            .messages-layout {
                grid-template-columns: 1fr;
            }

            .messages-sidebar {
                max-height: 200px;
                overflow-y: auto;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <i class="fas fa-store"></i><span>PShop</span>
                </a>
                <nav class="nav">
                    <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                    <a href="cart.html" class="nav-link cart-link">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                    <a href="messages.html" class="nav-link active"><i class="fas fa-envelope"></i> Messages</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="messages-page">
                <div class="page-header">
                    <h1><i class="fas fa-envelope"></i> Messages</h1>
                    <button class="btn btn-primary" id="newMessageBtn">
                        <i class="fas fa-plus"></i> New Message
                    </button>
                </div>

                <div class="messages-layout">
                    <div class="messages-sidebar">
                        <h3>Conversations</h3>
                        <div id="conversationList">
                            <!-- Loaded dynamically -->
                        </div>
                    </div>

                    <div class="chat-area">
                        <div class="chat-header" id="chatHeader">
                            <div class="avatar" style="width:40px;height:40px;"><i class="fas fa-headset"></i></div>
                            <div>
                                <h4>PShop Support</h4>
                                <small style="color:#888;">Online</small>
                            </div>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-message received">
                                <div class="chat-bubble">
                                    Hello! Welcome to PShop support. How can we help you today?
                                </div>
                            </div>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="messageInput" placeholder="Type your message...">
                            <button id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- New Message Modal -->
    <div class="modal" id="newMessageModal">
        <div class="modal-content">
            <button class="modal-close" id="closeNewMsgModal">&times;</button>
            <h2>New Message</h2>
            <form id="newMessageForm" class="new-message-form">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="msgSubject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="msgBody" placeholder="Your message..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/messages.js"></script>
</body>

</html>
