<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PShop - Product Details</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .product-detail {
            padding: 40px 0;
        }

        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .product-gallery {
            position: sticky;
            top: 100px;
        }

        .product-main-image {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            margin-bottom: 16px;
        }

        .product-main-image img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .product-info h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 2rem;
            color: var(--primary);
            font-weight: 700;
            margin: 16px 0;
        }

        .product-price .old-price {
            font-size: 1.2rem;
            color: #999;
            text-decoration: line-through;
            margin-left: 12px;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .product-rating .stars {
            color: #f59e0b;
        }

        .product-description {
            color: #666;
            line-height: 1.7;
            margin: 20px 0;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .quantity-selector button {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .quantity-selector input {
            width: 60px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            font-size: 1rem;
        }

        .product-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .product-meta {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eee;
        }

        .product-meta p {
            margin: 8px 0;
            color: #666;
        }

        .product-meta strong {
            color: #333;
        }

        @media (max-width: 768px) {
            .product-detail-layout {
                grid-template-columns: 1fr;
            }

            .product-gallery {
                position: static;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo">
                    <i class="fas fa-store"></i><span>PShop</span>
                </a>
                <div class="search-bar">
                    <input type="text" placeholder="Search products...">
                    <button><i class="fas fa-search"></i></button>
                </div>
                <nav class="nav">
                    <a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                    <a href="cart.html" class="nav-link cart-link">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="breadcrumb">
                <a href="../index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <a href="../index.html#products">Products</a>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbName">Product</span>
            </div>

            <div class="product-detail">
                <div class="product-detail-layout">
                    <div class="product-gallery">
                        <div class="product-main-image">
                            <img src="../assets/images/default-product.png" alt="Product" id="productImage">
                        </div>
                    </div>

                    <div class="product-info">
                        <span class="product-badge" id="productBadge">New</span>
                        <h1 id="productName">Product Name</h1>
                        <div class="product-rating">
                            <div class="stars" id="productStars">
                                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
                                    class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                            </div>
                            <span id="productReviews">(0 reviews)</span>
                        </div>
                        <div class="product-price">
                            <span id="productPrice">$0.00</span>
                            <span class="old-price" id="productOldPrice"></span>
                        </div>
                        <p class="product-description" id="productDescription">
                            Product description goes here...
                        </p>

                        <div class="quantity-selector">
                            <span>Quantity:</span>
                            <button id="qtyMinus">-</button>
                            <input type="number" id="qtyInput" value="1" min="1" max="99">
                            <button id="qtyPlus">+</button>
                        </div>

                        <div class="product-actions">
                            <button class="btn btn-primary btn-lg" id="addToCartBtn">
                                <i class="fas fa-shopping-cart"></i> Add to Cart
                            </button>
                            <button class="btn btn-outline btn-lg" id="wishlistBtn">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>

                        <div class="product-meta">
                            <p><strong>Category:</strong> <span id="productCategory">-</span></p>
                            <p><strong>SKU:</strong> <span id="productSku">-</span></p>
                            <p><strong>Availability:</strong> <span id="productAvailability" class="text-success">In
                                    Stock</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/product.js"></script>
</body>

</html>
